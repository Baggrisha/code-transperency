[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kontrol-ispolneniya"
version = "0.1.0"
description = "Локальный прототип объяснимой сверки документов исполнения контракта"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.4", "uvicorn==0.52.1",
  "python-multipart==0.0.32", "pdfplumber==0.11.9", "python-docx==1.2.0", "Pillow==13.0.0"
]

[tool.setuptools.packages.find]
include = ["kontrol*"]
