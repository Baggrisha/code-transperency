<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#26306E">
  <title>uzniki’s project — Контроль исполнения</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2326306E'/%3E%3Cpath d='m8 16 5 5 11-12' fill='none' stroke='%23FF7700' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/Unbounded-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Montserrat-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/brand.css">
</head>
<body>
  <a href="#main" class="skip-link">Перейти к содержимому</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand wordmark" href="#checks" aria-label="uzniki’s project, все проверки"><span>uzniki’s</span><span class="brand-accent">project</span></a>
      <nav class="side-nav">
        <button class="nav-item active" id="nav-checks" data-action="home" aria-current="page"><span class="identity-icon identity-icon--layers" aria-hidden="true"></span><span>Все проверки</span></button>
        <button class="nav-item" id="nav-workspace" data-action="workspace"><span class="identity-icon identity-icon--home" aria-hidden="true"></span><span>Рабочая область</span></button>
        <button class="nav-item" id="nav-history" data-action="global-history"><span class="identity-icon identity-icon--alarm" aria-hidden="true"></span><span>История проверок</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="sidebar-note"><strong>ПРОТОТИП</strong><p>Локальный режим<br>Результаты демонстрационных<br>кейсов не являются реальной<br>сверкой</p></div><div class="sidebar-tools"><button class="ghost" data-action="token">Доступ</button><a id="api-link" href="/docs" target="_blank" rel="noopener">API ↗</a><span id="busy" role="status" aria-live="polite">Обработка…</span></div></div>
    </aside>
    <main id="main" class="main page-registry" tabindex="-1"><p class="muted">Загрузка проверок…</p></main>
  </div>
  <dialog id="editor" aria-label="Редактирование документа"></dialog>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
'use strict';

// Shared view state. All document values and comparisons come from the API.
const $ = selector => document.querySelector(selector);
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const enc = encodeURIComponent;
const state = {
  cases: [], demos: [], current: null, run: null, options: null,
  token: globalThis.KONTROL_PREVIEW ? '' : sessionStorage.getItem('kontrol_token') || '', busy: 0,
  page: 'registry', tab: 'overview', lastCaseId: null, query: '', filter: 'all',
  files: [], events: [], history: null, historyOffset: 0,
  preview: Boolean(globalThis.KONTROL_PREVIEW), viewerURL: null, loadingCase: 0,
  selectedRunId: null, loadingRun: 0, viewerTicket: 0, modalTicket: 0, editorTicket: 0,
};
const types = {contract:'Контракт', specification:'Спецификация', delivery:'Накладная', acceptance:'Документ о приёмке', amendment:'Дополнительное соглашение'};
const reviewNames = {needs_review:'Требует рассмотрения', confirmed:'Расхождение подтверждено', resolved:'Устранено', dismissed:'Сигнал отклонён'};
const tabs = [['overview','Обзор'], ['documents','Документы'], ['recognition','Распознавание'], ['matching','Сопоставление'], ['results','Результаты'], ['actions','История действий']];
const number = value => value === null || value === undefined ? '—' : String(value);
const icon = name => {
  const paths = {
    grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    workspace:'<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M14 3v18"/>',
    history:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',
    search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
    chevron:'<path d="m6 9 6 6 6-6"/>',
  };
  return `<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || ''}</svg>`;
};

function toast(message, error = false) {
  const node = $('#toast');
  node.textContent = message;
  node.className = error ? 'error' : '';
  node.style.display = 'block';
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.style.display = 'none', error ? 10000 : 5000);
}

async function api(url, options = {}) {
  state.busy++;
  $('#busy').style.display = 'inline';
  try {
    if (state.preview) return await globalThis.KONTROL_PREVIEW.api(url, options);
    const headers = {
      ...(state.token ? {Authorization:'Bearer ' + state.token} : {}),
      ...(options.body && !(options.body instanceof FormData) ? {'Content-Type':'application/json'} : {}),
      ...options.headers,
    };
    const response = await fetch(url, {...options, headers});
    if (!response.ok) {
      let payload;
      try { payload = await response.json(); } catch { payload = {detail:response.statusText}; }
      const error = new Error(typeof payload.detail === 'string' ? payload.detail : JSON.stringify(payload.detail));
      error.status = response.status;
      throw error;
    }
    return options.blob ? response.blob() : response.json();
  } finally {
    state.busy--;
    $('#busy').style.display = state.busy ? 'inline' : 'none';
  }
}

function dateLabel(value, withTime = false) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleDateString('ru-RU', {timeZone:'Europe/Moscow'}) + (withTime ? ', ' + date.toLocaleTimeString('ru-RU', {timeZone:'Europe/Moscow', hour:'2-digit', minute:'2-digit'}) : '');
}

function latestReviews(run = state.run) {
  if (run?.latest_reviews) return run.latest_reviews;
  return Object.fromEntries((run?.reviews || []).map(review => [review.signal_id, review]));
}

function runCounts(run = state.run) {
  const signals = run?.result?.signals || [], reviews = latestReviews(run);
  const reviewed = signals.filter(signal => reviews[signal.id] && reviews[signal.id].status !== 'needs_review').length;
  return {signals:signals.length, reviewed, pending:signals.length - reviewed};
}

function contractNumber(dossier = state.current) {
  if (dossier?.contract_number) return dossier.contract_number;
  const numbers = [...new Set((dossier?.documents || []).filter(record => record.document.type === 'contract' && (record.document.status || 'active') === 'active').map(record => record.document.number?.trim() || record.document.contract_id?.trim()).filter(Boolean))];
  return numbers.length === 1 ? numbers[0] : '';
}

function statusInfo(item, run) {
  const status = run?.result?.status || item?.last_run_status;
  const stale = run?.stale ?? item?.last_run_stale;
  const counts = run ? runCounts(run) : {signals:item?.signal_count || 0, pending:item?.pending_signal_count || 0};
  if (stale) return {key:'stale', text:'Обновить сверку', tone:'warning'};
  if (!status) return {key:'draft', text:'Черновик', tone:'neutral'};
  if (counts.pending) return {key:'needs_review', text:'Требует рассмотрения', tone:'warning'};
  if (status === 'incomplete') return {key:'incomplete', text:'Нужны уточнения', tone:'warning'};
  if (counts.signals) return {key:'reviewed', text:'Рассмотрено', tone:'ok'};
  if (status === 'ok') return {key:'ok', text:'Расхождений нет', tone:'ok'};
  return {key:'needs_review', text:'Требует рассмотрения', tone:'warning'};
}

function isDemo(dossier = state.current) {
  return Boolean(dossier?.is_demo || /синтетическ|демо|^T\d{2}\s*·/i.test((dossier?.title || '') + ' ' + (dossier?.description || '')));
}

function setRoute(hash) {
  if (globalThis.history?.replaceState && globalThis.location) globalThis.history.replaceState(null, '', hash);
}

function syncNav() {
  for (const [id, page] of [['nav-checks','registry'], ['nav-workspace','workspace'], ['nav-history','history']]) {
    const node = $('#' + id);
    node.className = 'nav-item' + (state.page === page ? ' active' : '');
    node.setAttribute('aria-current', state.page === page ? 'page' : 'false');
  }
  $('#main').className = 'main page-' + state.page;
}

function header(eyebrow, title, subtitle, action = '') {
  return `<header class="page-header"><div class="header-copy"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${action ? `<div class="header-action">${action}</div>` : ''}</header>`;
}

function stat(label, value) {
  return `<div class="stat"><span>${label}</span><b>${esc(value)}</b></div>`;
}

function demoSelect() {
  return `<select id="demo-choice" aria-label="Демонстрационный сценарий">${state.demos.map(item => `<option value="${esc(item.id)}" ${item.id === 'T02' ? 'selected' : ''}>${esc(item.id)} · ${esc(item.title)}</option>`).join('')}</select><button data-action="demo">Открыть пример</button>`;
}

async function refreshList() {
  state.cases = await api('/api/cases');
  if (state.page === 'registry') home(false);
}

function workspaceContext() {
  return {caseId:state.current?.id, runId:state.run?.id, ticket:state.loadingCase,
    options:structuredClone(state.options || {}), selectedRunId:state.selectedRunId};
}

function isCurrentWorkspace(context, sameRun = false) {
  return context.ticket === state.loadingCase && state.page === 'workspace'
    && state.current?.id === context.caseId && (!sameRun || state.run?.id === context.runId);
}

async function afterSaved(message, refresh) {
  try { await refresh(); toast(message); }
  catch (error) { toast(message + ' Не удалось обновить экран. Откройте проверку заново: ' + error.message, true); }
}

function registryRows() {
  const query = state.query.trim().toLocaleLowerCase('ru');
  const entries = state.cases.filter(item => {
    const matchesText = (item.title + ' ' + (item.contract_number || '')).toLocaleLowerCase('ru').includes(query);
    return matchesText && (state.filter === 'all' || statusInfo(item).key === state.filter);
  });
  return entries.map(item => {
    const status = statusInfo(item);
    return `<tr data-action="open" data-id="${esc(item.id)}"><td class="cell-id"><button class="table-link" data-action="open" data-id="${esc(item.id)}">${esc(item.contract_number || 'Без номера')}</button></td><td class="cell-description"><span>${esc(item.title)}</span>${isDemo(item) ? '<small class="demo-tag">Демо-кейс</small>' : ''}</td><td class="cell-status"><span class="badge ${status.tone}">${status.text}</span></td><td class="cell-count">${item.document_count || 0}</td><td class="cell-count">${item.signal_count ?? '—'}</td><td class="cell-date"><time>${esc(dateLabel(item.updated_at || item.last_run_at || item.created_at))}</time></td></tr>`;
  }).join('') || `<tr><td colspan="6" class="table-empty"><span class="empty-message">${state.cases.length ? 'По вашему запросу проверок не найдено. Измените поиск или статус.' : 'Проверок пока нет. Создайте новую или откройте демо-кейс.'}</span></td></tr>`;
}

function home(invalidate = true) {
  if (invalidate) ++state.loadingCase;
  state.page = 'registry';
  state.current = null;
  state.run = null;
  state.selectedRunId = null;
  syncNav();
  setRoute('#checks');
  const processed = state.cases.filter(item => ['ok','reviewed'].includes(statusInfo(item).key)).length;
  $('#main').innerHTML = `${header('Все проверки', 'Проверки контрактов', 'Реестр проверочных дел и состояние рассмотрения', '<button class="primary" data-action="new">+ Новая проверка</button>')}
    <section class="stats registry-stats" aria-label="Сводка проверок">${stat('Всего проверок',state.cases.length)}${stat('В работе',state.cases.length - processed)}${stat('Сигналов',state.cases.reduce((sum,item) => sum + (item.signal_count || 0),0))}${stat('Рассмотрено',processed)}</section>
    <section class="card registry-card" aria-label="Реестр проверок"><div class="registry-tools"><div class="search-wrap">${icon('search')}<input class="search" id="registry-query" type="search" autocomplete="off" aria-label="Поиск по контракту или названию" placeholder="Поиск по контракту или названию" value="${esc(state.query)}"></div><select id="registry-status" aria-label="Статус проверки">${[['all','Все статусы'],['draft','Черновик'],['needs_review','Требует рассмотрения'],['incomplete','Нужны уточнения'],['stale','Обновить сверку'],['reviewed','Рассмотрено'],['ok','Расхождений нет']].map(([value,label]) => `<option value="${value}" ${state.filter === value ? 'selected' : ''}>${label}</option>`).join('')}</select></div>
    <div class="scroll"><table class="data-table registry-table"><thead><tr><th scope="col" class="cell-id">Контракт</th><th scope="col" class="cell-description">Наименование</th><th scope="col" class="cell-status">Статус</th><th scope="col" class="cell-count">Документы</th><th scope="col" class="cell-count">Сигналы</th><th scope="col" class="cell-date">Изменено</th></tr></thead><tbody id="registry-rows">${registryRows()}</tbody></table></div></section>
    ${state.demos.length ? `<details class="demo-launcher"><summary>${state.cases.length ? 'Открыть демонстрационный комплект' : 'Попробовать на демо-кейсе'}</summary><p class="muted small">Синтетические документы для знакомства с системой.</p><div class="row">${demoSelect()}</div></details>` : ''}`;
}

async function openCase(id, options, tab, runId) {
  const ticket = ++state.loadingCase;
  const previousId = state.current?.id;
  const selectedRunId = runId === undefined ? (previousId === id ? state.selectedRunId : null) : runId;
  const dossier = await api('/api/cases/' + enc(id));
  if (ticket !== state.loadingCase) return false;
  const targetRunId = selectedRunId || dossier.runs[0]?.id;
  const savedRun = targetRunId ? await api('/api/runs/' + enc(targetRunId)) : null;
  if (ticket !== state.loadingCase) return false;
  if (savedRun?.case_id && savedRun.case_id !== id) throw new Error('Этот результат относится к другой проверке');
  state.current = dossier;
  state.run = savedRun;
  state.selectedRunId = selectedRunId || null;
  state.lastCaseId = id;
  state.page = 'workspace';
  state.tab = tab || (previousId === id ? state.tab : 'overview');
  state.files = [];
  const previous = savedRun?.request ? structuredClone(savedRun.request) : null;
  if (previous) delete previous.documents;
  state.options = options || previous || {as_of:new Date().toLocaleDateString('sv-SE'), delivery_complete:false};
  render();
  await refreshList();
  if (ticket !== state.loadingCase || state.current?.id !== id || state.page !== 'workspace') return false;
  if (state.tab === 'actions') await loadEvents();
  return ticket === state.loadingCase && state.page === 'workspace' && state.current?.id === id;
}

function staleNotice() {
  return state.run?.stale ? '<div class="notice" role="status"><b>Документы изменены после этой проверки.</b> Выполните сверку ещё раз. Ниже показан сохранённый результат.</div>' : '';
}

function render() {
  const dossier = state.current;
  if (!dossier) return home();
  state.page = 'workspace';
  syncNav();
  setRoute('#case/' + enc(dossier.id) + '/' + state.tab + (state.selectedRunId ? '/run/' + enc(state.selectedRunId) : ''));
  const status = statusInfo(dossier, state.run);
  const views = {overview:renderOverview, documents:renderDocuments, recognition:renderRecognition, matching:renderMatching, results:renderResults, actions:renderActions};
  $('#main').innerHTML = `${header('Рабочая область', esc(dossier.title), `Контракт <strong>${esc(contractNumber() || 'без номера')}</strong> – ${status.text.toLocaleLowerCase('ru')}`, '<button data-action="home">← К списку</button>')}
    <div class="tabs" role="tablist" aria-label="Разделы проверки">${tabs.map(([key,label]) => `<button class="tab${state.tab === key ? ' active' : ''}" id="tab-${key}" data-action="tab" data-tab="${key}" role="tab" aria-controls="workspace-panel" aria-selected="${state.tab === key}" tabindex="${state.tab === key ? '0' : '-1'}">${label}</button>`).join('')}</div>
    <div id="workspace-panel" role="tabpanel" aria-labelledby="tab-${state.tab}">${(views[state.tab] || renderOverview)()}</div>`;
}

function contractForm(id = 'contract-form', button = 'Сохранить реквизиты') {
  const dossier = state.current;
  return `<form id="${id}" class="contract-form" data-form="case-metadata"><div class="field"><label for="${id}-number">Номер</label><input id="${id}-number" name="contract_number" value="${esc(contractNumber())}" maxlength="300" placeholder="Номер контракта"></div><div class="field"><label for="${id}-title">Наименование</label><input id="${id}-title" name="title" value="${esc(dossier.title)}" maxlength="300" required></div><div class="field"><label for="${id}-description">Описание</label><textarea id="${id}-description" name="description" rows="3" maxlength="5000" placeholder="Описание проверки">${esc(dossier.description || '')}</textarea></div><div class="form-actions"><button class="primary" type="submit">${button}</button>${id === 'contract-form' ? '<button type="button" data-action="tab" data-tab="documents">К документам →</button>' : ''}</div>${state.preview ? '' : '<p class="small muted form-help">Поля карточки не изменяют исходные документы. Исправить извлечённые значения можно в разделе «Распознавание».</p>'}</form>`;
}

function renderOverview() {
  const counts = runCounts();
  return `<section class="stats overview-stats" aria-label="Состояние проверки">${stat('Документов',state.current.documents.length)}${stat('Сигналов',counts.signals)}${stat('Ожидают решения',counts.pending)}${stat('Рассмотрено',counts.reviewed)}</section><section class="card contract-card"><h2 class="section-heading"><span class="identity-icon identity-icon--wallet section-icon" aria-hidden="true"></span><span>Данные контракта</span></h2>${contractForm()}</section><div class="notice">Система предоставляет информационные сигналы. Окончательная оценка документов остаётся за специалистом.</div>${staleNotice()}`;
}

function documentName(record) { return record.document.filename || record.original_name || record.id; }
function documentTypeLabel(type) { return types[type] || (state.preview && type === 'other' ? 'Другое' : type); }
function documentSize(record) {
  const bytes = record.size_bytes;
  return bytes ? Math.round(bytes / 1024).toLocaleString('ru-RU') + ' КБ' : '';
}
function documentMeta(record) {
  const doc = record.document;
  return [documentTypeLabel(doc.type), documentSize(record), 'версия ' + record.revision, doc.status === 'cancelled' ? 'отменён' : doc.status === 'superseded' ? 'заменён' : ''].filter(Boolean).join(' – ');
}

function renderDocuments() {
  const records = state.current.documents;
  return `<div class="workspace-grid documents-grid"><section class="card upload-panel"><h2 class="section-heading"><span class="identity-icon identity-icon--folder section-icon" aria-hidden="true"></span><span>Загрузка документов</span></h2><div class="dropzone" id="dropzone"><span class="identity-icon identity-icon--folder upload-icon" aria-hidden="true"></span><h3>Перетащите файлы сюда</h3><p class="upload-hint">или выберите файлы на устройстве (<span>${state.preview ? 'PDF, PNG, JPEG, TXT' : 'PDF, DOCX, PNG, JPEG, TIFF, TXT, CSV, TSV, JSON'}</span>)</p><div class="file-picker-row"><button class="file-button" data-action="choose-files">Выбрать файлы</button><span id="file-count">Файлы не выбраны</span></div><input class="visually-hidden" type="file" id="files" multiple aria-label="Выбрать документы" accept=".pdf,.docx,.txt,.csv,.tsv,.json,.png,.jpg,.jpeg,.tif,.tiff"></div>
    <div id="upload-controls" hidden><div class="row"><label class="grow">Тип документа<select id="upload-type"><option value="">Определить автоматически</option>${Object.entries(types).map(([key,label]) => `<option value="${key}">${label}</option>`).join('')}</select></label><label class="grow">Номер контракта<input id="upload-contract" value="${esc(contractNumber())}" placeholder="Если не читается в файле"></label></div><p id="upload-selection" class="small muted"></p><button class="primary" data-action="upload">Загрузить документы</button></div>
    <p class="small muted storage-note">${state.preview ? 'Автономный макет. Загрузка и распознавание файлов доступны в версии с сервером. Изменения макета сохраняются только в открытой вкладке.' : 'Исходные файлы, реквизиты и решения сохраняются на локальном сервере. До 20 МБ на файл. Повторная загрузка одного файла не создаёт дубликат.'}</p></section>
    <section class="card document-panel"><h2 class="section-heading"><span class="identity-icon identity-icon--folder section-icon" aria-hidden="true"></span><span>Комплект документов: <span class="accent">${records.length}</span></span></h2><div class="document-list">${records.map(record => `<div class="document-row${record.document.status === 'cancelled' ? ' cancelled' : ''}"><div class="document-info"><b>${esc(documentName(record))}</b><span class="muted">${esc(documentMeta(record))}</span></div><div class="document-actions"><button data-action="type" data-id="${esc(record.id)}" aria-label="Изменить тип ${esc(documentName(record))}">Тип</button><button data-action="view" data-id="${esc(record.id)}" aria-label="Открыть ${esc(documentName(record))}">Открыть</button><button class="icon-button" data-action="exclude" data-id="${esc(record.id)}" aria-label="${record.document.status === 'cancelled' ? 'Восстановить' : 'Исключить из сверки'} ${esc(documentName(record))}">${record.document.status === 'cancelled' ? '↶' : '×'}</button></div></div>`).join('') || '<div class="emptylist">Загрузите контракт, спецификацию, накладные и документы о приёмке.</div>'}</div></section></div>
    <div class="notice">Если в загруженном комплекте отсутствует документ, это не означает, что он отсутствует у сторон контракта.</div><div class="form-actions"><button class="primary" data-action="tab" data-tab="recognition">К распознаванию →</button></div>`;
}

function renderRecognition() {
  const documents = state.current.documents;
  const notice = state.preview

function runControls() {
  if (state.preview) return '';
  return `<section class="card run-controls"><div class="row between"><div class="row"><label>Дата среза<input id="asof" type="date" value="${esc(state.options.as_of)}" required></label><label class="check"><input id="complete" type="checkbox" ${state.options.delivery_complete ? 'checked' : ''}>Поставка по комплекту завершена</label></div><button class="primary" data-action="run" ${!state.current.documents.length ? 'disabled' : ''}>${state.run ? 'Повторить сверку' : 'Выполнить сверку'}</button></div><p class="small muted form-help">До завершения поставки остаток по контракту показывается справочно. Противоречия между актами и накладными проверяются при каждом запуске.</p></section>`;
}

function quantity(value, unit) {
  return value == null ? '—' : esc(String(value)) + (unit ? ' ' + esc(unit) + (unit === 'шт' ? '.' : '') : '');
}

function renderMatching() {
  const result = state.run?.result;
  const note = state.preview
    ? 'Автоматическое связывание товарных позиций ожидает подключения серверного модуля. Система не выполняет сравнение единиц измерения без подтверждённого коэффициента пересчёта.'
    : 'Позиции связаны по данным последней сверки. Неоднозначные связи требуют подтверждения. Система не сравнивает разные единицы измерения без подтверждённого коэффициента пересчёта.';
  return `${staleNotice()}<section class="card matching-card"><h2 class="section-heading"><span class="identity-icon identity-icon--layers section-icon" aria-hidden="true"></span><span>Сопоставление позиций</span></h2><div class="notice">${result ? note : 'Запустите сверку, чтобы связать позиции из контракта, накладных и документов о приёмке.'}</div><div class="scroll"><table class="data-table matching-table"><thead><tr><th scope="col" class="cell-description">Позиция</th><th scope="col" class="cell-count">Контракт</th><th scope="col" class="cell-count">Накладная</th><th scope="col" class="cell-count">Приёмка</th><th scope="col" class="cell-status">Состояние</th></tr></thead><tbody>${(result?.positions || []).map(position => {
    const signals = result.signals.filter(signal => signal.position_id === position.line_id);
    const blocked = !position.complete;
    const text = blocked ? 'Нужны уточнения' : signals.length ? 'Требует проверки' : 'Сопоставлено';
    return `<tr><td class="cell-description">${esc(position.name || position.line_id)}</td><td class="cell-count">${quantity(position.expected_quantity,position.unit)}</td><td class="cell-count">${quantity(position.delivered_quantity,position.unit)}</td><td class="cell-count">${quantity(position.accepted_quantity,position.unit)}</td><td class="cell-status"><span class="badge ${blocked || signals.length ? 'warning' : 'ok'}">${text}</span></td></tr>`;
  }).join('') || '<tr><td colspan="5" class="table-empty"><span class="empty-message">Позиции появятся после сверки комплекта.</span></td></tr>'}</tbody></table></div><p class="matching-note muted">${state.preview ? 'Демонстрационное сопоставление из синтетического кейса T02.' : result ? `Срез на ${esc(dateLabel(result.as_of))}. Количества приведены по действующим документам выбранной редакции.` : 'Сначала загрузите и проверьте исходные документы.'}</p></section>
    ${runControls()}${result ? renderLinks(result) : ''}<div class="form-actions"><button class="primary" data-action="tab" data-tab="results">К результатам →</button></div>`;
}

function renderResults() {
  return state.run ? renderResult(state.run) : `<section class="card"><h2 class="section-heading"><span class="identity-icon identity-icon--award section-icon" aria-hidden="true"></span><span>Результаты проверки</span></h2><p class="muted">Результат появится после сверки загруженного комплекта.</p><button data-action="tab" data-tab="matching">К сопоставлению →</button></section>`;
}

function renderResult(run) {
  const result = run.result, counts = runCounts(run), reviews = latestReviews(run);
  const headings = {ok:'Расхождения не обнаружены', needs_review:'Комплект требует проверки', incomplete:'Нужно уточнить данные'};
  return `${staleNotice()}<div class="row between results-heading"><h2 class="section-heading"><span class="identity-icon identity-icon--award section-icon" aria-hidden="true"></span><span>${headings[result.status] || 'Результаты проверки'}</span></h2><div class="row">${['html','pdf','csv','json'].map(format => `<button data-action="export" data-format="${format}">${format === 'html' ? 'Отчёт' : format.toUpperCase()}</button>`).join('')}</div></div><section class="stats overview-stats">${stat('Сигналов',counts.signals)}${stat('Ожидают решения',counts.pending)}${stat('Рассмотрено',counts.reviewed)}${stat('Позиций',result.positions.length)}</section>
    <section class="card"><h2 class="section-heading"><span class="identity-icon identity-icon--layers section-icon" aria-hidden="true"></span><span>Количество по позициям</span></h2><div class="scroll"><table class="data-table quantity-table"><thead><tr><th class="cell-description">Товар</th><th class="cell-unit">Ед.</th><th class="cell-count">По условиям</th><th class="cell-count">Поставлено</th><th class="cell-count">Принято</th><th class="cell-count">Остаток</th></tr></thead><tbody>${result.positions.map(position => `<tr><td class="cell-description">${esc(position.name || position.line_id)}${!position.complete ? '<small>Сравнение ограничено</small>' : ''}</td><td class="cell-unit">${esc(position.unit || '—')}</td><td class="cell-count">${esc(number(position.expected_quantity))}</td><td class="cell-count">${esc(number(position.delivered_quantity))}</td><td class="cell-count">${esc(number(position.accepted_quantity))}</td><td class="cell-count">${esc(number(position.remaining_quantity))}</td></tr>`).join('') || '<tr><td colspan="6" class="table-empty"><span class="empty-message">Нет достаточных данных для сводки.</span></td></tr>'}</tbody></table></div></section>
    <section class="card"><h2 class="section-heading"><span class="identity-icon identity-icon--bell section-icon" aria-hidden="true"></span><span>Сигналы и источники</span></h2>${result.signals.map(signal => `<article class="signal"><div class="row"><span class="badge ${reviews[signal.id] && reviews[signal.id].status !== 'needs_review' ? 'ok' : signal.blocks_comparison ? 'warning' : 'neutral'}">${esc(reviews[signal.id] ? reviewNames[reviews[signal.id].status] : signal.blocks_comparison ? 'Сравнение ограничено' : 'Требует проверки')}</span>${reviews[signal.id] && signal.blocks_comparison ? '<span class="badge warning">Сравнение ограничено</span>' : ''}<span class="small muted">${esc(signal.code)}</span></div><h3>${esc(signal.title)}</h3><p>${esc(signal.explanation)}</p><div class="values"><div><span class="small muted">Ожидается</span><b>${esc(showValue(signal.expected))}</b></div><div><span class="small muted">В комплекте</span><b>${esc(showValue(signal.actual))}</b></div></div><p class="small muted">Правило: ${esc(signal.rule)}</p><details><summary>Исходные данные · ${signal.sources.length} фрагментов</summary>${signal.sources.map(source => `<div class="source"><div class="row between"><b>${esc(source.filename || source.document_id)}${source.page ? ' · стр. ' + esc(source.page) : ''}${source.row ? ' · строка ' + esc(source.row) : ''}</b><div class="row"><button data-action="view-snapshot" data-id="${esc(source.document_id)}">Просмотреть</button><button data-action="edit" data-id="${esc(source.document_id)}">Открыть реквизиты</button></div></div>${esc(source.excerpt)}</div>`).join('')}</details><div class="review">${reviews[signal.id] ? `<p class="small"><b>${esc(reviewNames[reviews[signal.id].status])}</b> · ${esc(reviews[signal.id].reviewer)}<br>${esc(reviews[signal.id].comment)}</p>` : ''}<form data-signal="${esc(signal.id)}"><label>Решение<select name="status">${Object.entries(reviewNames).map(([key,label]) => `<option value="${key}" ${reviews[signal.id]?.status === key ? 'selected' : ''}>${label}</option>`).join('')}</select></label><label>Проверяющий<input name="reviewer" required maxlength="200" placeholder="Имя или роль"></label><label class="comment">Комментарий<input name="comment" required maxlength="10000" placeholder="Что проверено по документам"></label><button type="submit" class="primary">Сохранить</button></form></div></article>`).join('') || '<span class="badge ok">Сигналов нет в пределах выполненных проверок</span>'}</section>
    <details class="card"><summary>Учёт версий и воспроизводимость</summary><ul class="audit">${result.audit.map(entry => `<li>${esc(entry.explanation)} <span class="small muted">${esc(entry.document_ids.join(', '))}</span></li>`).join('') || '<li>Корректировки не применялись.</li>'}</ul><p class="small">Правила ${esc(result.engine_version)} · срез ${esc(result.as_of)}</p><p class="hash">Вход: ${esc(result.input_hash)}<br>Результат: ${esc(result.result_hash)}</p></details><p class="footer">Сигнал показывает документальное расхождение или недостаток данных. Окончательная оценка остаётся за специалистом.</p>`;
}

function renderActions() {
  return '<section class="card"><div class="row between"><h2 class="section-heading"><span class="identity-icon identity-icon--alarm section-icon" aria-hidden="true"></span><span>История действий</span></h2><button data-action="events">Обновить</button></div><div id="events"><p class="muted">Загрузка истории…</p></div></section>';
}

const eventNames = {case_created:'Создана проверка', case_updated:'Обновлены реквизиты карточки', document_added:'Загружен документ', extraction_reviewed:'Исправлены реквизиты документа', duplicate_upload:'Повторная загрузка исключена', duplicate_document:'Повторный документ исключён', check_completed:'Выполнена сверка', signal_reviewed:'Сохранено решение по сигналу', report_exported:'Выгружен отчёт'};
async function loadEvents() {
  const ticket = state.loadingCase;
  const id = state.current?.id;
  if (!id) return;
  const entries = await api(`/api/cases/${enc(id)}/events`);
  if (ticket !== state.loadingCase || state.page !== 'workspace' || state.current?.id !== id || state.tab !== 'actions') return;
  state.events = entries;
  $('#events').innerHTML = entries.length ? `<ol class="timeline">${entries.slice().reverse().map(entry => `<li><div><strong>${esc(eventNames[entry.action] || entry.action)}</strong><time class="small muted">${esc(dateLabel(entry.created_at,true))}</time></div>${entry.payload?.comment ? `<p>${esc(entry.payload.comment)}</p>` : ''}${entry.payload?.reviewer ? `<p class="small muted">${esc(entry.payload.reviewer)}</p>` : ''}<details><summary>Подробности</summary><pre class="source">${esc(JSON.stringify(entry.payload,null,2))}</pre></details></li>`).join('')}</ol>` : '<p class="muted">История пока пуста.</p>';
}

async function showHistory(offset = 0) {
  const ticket = ++state.loadingCase;
  state.page = 'history';
  state.historyOffset = offset;
  syncNav();
  setRoute('#history');
  $('#main').innerHTML = header('История проверок','Журнал проверок','Сохранённые результаты и состояние рассмотрения') + '<div class="card"><p class="muted">Загрузка журнала…</p></div>';
  const history = await api('/api/runs?limit=25&offset=' + offset);
  if (ticket !== state.loadingCase || state.page !== 'history' || state.historyOffset !== offset) return;
  state.history = history;
  const names = {ok:'Расхождений нет', needs_review:'Требует рассмотрения', incomplete:'Нужны уточнения'};
  $('#main').innerHTML = header('История проверок','Журнал проверок','Сохранённые результаты и состояние рассмотрения') + `<section class="card"><div class="scroll"><table class="data-table history-table"><thead><tr><th class="cell-description">Проверка</th><th class="cell-date">Дата запуска</th><th class="cell-status">Состояние</th><th class="cell-count">Сигналы</th><th class="cell-action"></th></tr></thead><tbody>${history.items.map(item => `<tr><td class="cell-description">${esc(item.case_title)}</td><td class="cell-date">${esc(dateLabel(item.created_at,true))}</td><td class="cell-status"><span class="badge ${item.stale || item.status !== 'ok' ? 'warning' : 'ok'}">${item.stale ? 'Сохранённая редакция' : names[item.status] || item.status}</span></td><td class="cell-count">${item.signal_count ?? '—'}</td><td class="cell-action"><button data-action="open-run" data-id="${esc(item.id)}" data-case="${esc(item.case_id)}">Открыть</button></td></tr>`).join('') || '<tr><td colspan="5" class="table-empty"><span class="empty-message">Выполненных сверок пока нет.</span></td></tr>'}</tbody></table></div><div class="row between pagination"><p class="small muted">${history.total ? `${offset + 1}–${Math.min(offset + history.limit,history.total)} из ${history.total}` : '0 проверок'}</p><div class="row"><button data-action="history-page" data-offset="${Math.max(0,offset - 25)}" ${offset === 0 ? 'disabled' : ''}>← Назад</button><button data-action="history-page" data-offset="${offset + 25}" ${offset + 25 >= history.total ? 'disabled' : ''}>Далее →</button></div></div></section>`;
}


// Existing reviewed-field editor and SKU links are preserved.
function showValue(v){if(v===null||v===undefined)return '—';return typeof v==='object'?JSON.stringify(v):v}
function renderLinks(r){
  const pending=r.matches.filter(x=>x.state!=='matched');
  const automatic=r.matches.filter(x=>x.state==='matched'&&x.method==='similar_sku_auto');
  const contractMatches=r.audit.filter(x=>x.code==='SIMILAR_CONTRACT_ID');
  if(!pending.length&&!automatic.length&&!contractMatches.length)return '';
  const contractCard=contractMatches.length?`<section class="card"><h2>Автоматически сопоставленные номера договоров</h2><div class="notice"><b>Похожие номера договоров сопоставлены автоматически.</b> Сверьте значения с оригиналами документов.</div>${contractMatches.map(x=>`<div class="source">${esc(x.explanation)}<br><span class="muted">Документы: ${esc(x.document_ids.join(', '))}</span></div>`).join('')}</section>`:'';
  if(!pending.length&&!automatic.length)return contractCard;
  const documents=state.run?.request?.documents??(state.current?.documents||[]).map(record=>record.document);
  const byId=new Map(documents.map(document=>[document.id,document]));
  const item=(documentId,lineId)=>byId.get(documentId)?.items?.find(row=>row.line_id===lineId);
  const sku=row=>!row?'недоступен':row.sku==null||row.sku===''?'не указан':row.sku;
  const similar=x=>x.method==='similar_sku'||x.method==='similar_sku_auto';
  const autoCard=automatic.length?`<section class="card"><h2>Автоматически сопоставленные похожие артикулы</h2><div class="notice"><b>Похожие артикулы связаны автоматически.</b> Остальные реквизиты сверяются отдельно. Сверьте значения с оригиналами документов.</div>${automatic.map(x=>`<div class="source"><span class="badge blue">Связано автоматически</span><div>Исходный артикул: <b>${esc(sku(item(x.document_id,x.line_id)))}</b> · ${esc(x.document_id)}, строка ${esc(x.line_id)}</div><div>Артикул позиции: <b>${esc(sku(item(x.target_document_id,x.target_line_id)))}</b> · ${esc(x.target_document_id??'документ не указан')}, строка ${esc(x.target_line_id??'не указана')}</div><div>${esc(x.explanation)}</div></div>`).join('')}</section>`:'';
  if(!pending.length)return contractCard+autoCard;
  return `${contractCard}${autoCard}<section class="card"><h2>Уточнить связи строк</h2><p class="muted small">Выберите позицию спецификации после просмотра исходника.</p>${pending.some(similar)?'<p class="muted small">Похожие артикулы отмечены как предложения. Сверьте оба значения с оригиналами: до подтверждения сравнение ограничено.</p>':''}${pending.map(x=>{
    const isSimilar=similar(x),target=byId.get(x.target_document_id),candidates=new Set(x.candidates||[]);
    const choices=isSimilar?(target?.items||[]):r.positions;
    return `<div class="row" style="margin-bottom:12px"><span class="grow editor-id" style="min-width:0">${esc(x.document_id)} · строка ${esc(x.line_id)}<small class="muted"> · ${esc(x.explanation)}</small>${isSimilar?`<br>Исходный артикул: <b>${esc(sku(item(x.document_id,x.line_id)))}</b><br><small class="muted">Целевой документ: ${esc(x.target_document_id??'не указан')}${!target?' · Данные целевого документа недоступны':!target.items?.length?' · В целевом документе нет строк для выбора':''}</small>`:''}</span><select style="max-width:100%" aria-label="Позиция для ${esc(x.document_id)}, строка ${esc(x.line_id)}" data-link-document="${esc(x.document_id)}" data-link-line="${esc(x.line_id)}"><option value="">Оставить без подтверждения</option>${choices.map(p=>`<option value="${esc(p.line_id)}">${isSimilar?`${candidates.has(p.line_id)?'Предложение · ':''}${esc(p.name||p.line_id)} · артикул ${esc(sku(p))} · строка ${esc(p.line_id)}`:esc(p.name||p.line_id)}</option>`).join('')}</select></div>`;
  }).join('')}<div class="row"><input id="link-reviewer" placeholder="Проверяющий" aria-label="Проверяющий связи"><input id="link-comment" class="grow" placeholder="Основание сопоставления" aria-label="Основание сопоставления"><button data-action="links">Применить и пересчитать</button></div></section>`;
}

// Navigation and actions share the same API in every screen.
async function run() {
  if (!state.current) throw new Error('Откройте проверку');
  const context = workspaceContext(), runTicket = ++state.loadingRun;
  state.options = {
    ...state.options,
    as_of: $('#asof')?.value || state.options?.as_of,
    delivery_complete: $('#complete') ? $('#complete').checked : Boolean(state.options?.delivery_complete),
  };
  if (!state.options.as_of) throw new Error('Укажите дату среза');
  const options = structuredClone(state.options);
  const response = await api(`/api/cases/${enc(context.caseId)}/runs`, {method:'POST', body:JSON.stringify(options)});
  await afterSaved('Сверка выполнена.', async () => {
    if (isCurrentWorkspace(context) && state.loadingRun === runTicket) {
      const savedRun = await api('/api/runs/' + enc(response.id));
      const dossier = await api('/api/cases/' + enc(context.caseId));
      if (isCurrentWorkspace(context) && state.loadingRun === runTicket) {
        state.run = savedRun;
        state.current = dossier;
        state.selectedRunId = null;
        render();
      }
    }
    await refreshList();
  });
  return response;
}

async function download(url, name) {
  const blob = await api(url, {blob:true});
  const objectURL = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = objectURL;
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(objectURL),1000);
}

function openModal(markup, className = '') {
  ++state.modalTicket;
  ++state.viewerTicket;
  if (state.viewerURL) { URL.revokeObjectURL(state.viewerURL); state.viewerURL = null; }
  const dialog = $('#modal');
  dialog.className = className;
  dialog.innerHTML = markup;
  if (!dialog.open) dialog.showModal();
}

function closeModal() {
  ++state.modalTicket;
  ++state.viewerTicket;
  $('#modal').close();
}

function toggleTypeOptions(force) {
  const list = $('#type-options');
  if (!list) return;
  const expanded = force ?? list.hidden;
  list.hidden = !expanded;
  $('#type-trigger').setAttribute('aria-expanded', String(expanded));
  if (expanded) list.querySelector('[aria-selected="true"]')?.focus();
  else $('#type-trigger').focus();
}

function selectType(button) {
  if (button.getAttribute('aria-disabled') === 'true') {
    $('#type-help').hidden = false;
    $('#type-help').textContent = 'Для сверки подходят контракт, спецификация, накладная, документ о приёмке или дополнительное соглашение. Для другого документа сначала уточните его роль.';
    toggleTypeOptions(false);
    return;
  }
  $('#type-value').value = button.dataset.value;
  $('#type-selected').textContent = button.textContent;
  for (const option of document.querySelectorAll('#type-options [role="option"]')) option.setAttribute('aria-selected',String(option === button));
  const corrected = button.dataset.value === 'corrected';
  $('#type-help').hidden = !corrected;
  $('#type-help').textContent = corrected ? 'Исправленная версия сохраняет категорию документа. После продолжения укажите заменяемый документ и редакцию в реквизитах.' : '';
  toggleTypeOptions(false);
}

function exclusionModal(id) {
  const record = state.current.documents.find(item => item.id === id);
  if (!record) throw new Error('Документ не найден');
  const restoring = record.document.status === 'cancelled';
  openModal(`${modalHeader('Состав комплекта',restoring ? 'Восстановить документ' : 'Исключить из сверки')}<p class="modal-filename">${esc(documentName(record))}</p><p class="modal-description">${restoring ? 'Документ снова будет участвовать в следующей сверке.' : 'Документ получит статус «Отменён» и не будет участвовать в следующей сверке. Оригинал и история сохранятся.'}</p><form data-form="document-status" data-id="${esc(id)}" data-status="${restoring ? 'active' : 'cancelled'}"><div class="field"><label for="status-reviewer">Проверяющий</label><input id="status-reviewer" name="reviewer" required maxlength="200"></div><div class="field"><label for="status-comment">Причина</label><textarea id="status-comment" name="comment" required maxlength="10000"></textarea></div><div class="modal-actions"><button class="primary" type="submit">${restoring ? 'Восстановить' : 'Исключить из сверки'}</button><button type="button" data-action="close-modal">Отмена</button></div></form>`);
}

function snapshotContent(doc) {
  return `<div class="viewer-data"><div class="notice">Показаны сохранённые реквизиты и фрагменты источника. Они не заменяют оригинальный файл.</div><dl class="document-facts"><div><dt>Категория</dt><dd>${esc(documentTypeLabel(doc.type))}</dd></div><div><dt>Номер</dt><dd>${esc(doc.number || 'Не указан')}</dd></div><div><dt>Дата</dt><dd>${esc(dateLabel(doc.date))}</dd></div><div><dt>Контракт</dt><dd>${esc(doc.contract_id || 'Не указан')}</dd></div></dl>${doc.source ? `<pre class="source">${esc(doc.source.excerpt)}</pre>` : ''}<div class="scroll"><table class="data-table document-items-table"><thead><tr><th class="cell-description">Позиция</th><th class="cell-count">Количество</th><th class="cell-unit">Ед.</th><th class="cell-amount">Цена</th></tr></thead><tbody>${doc.items.map(item => `<tr><td class="cell-description">${esc(item.name || item.line_id)}</td><td class="cell-count">${esc(number(item.quantity))}</td><td class="cell-unit">${esc(item.unit || '—')}</td><td class="cell-amount">${esc(number(item.unit_price))}</td></tr>`).join('') || '<tr><td colspan="4" class="table-empty"><span class="empty-message">Товарные строки не извлечены.</span></td></tr>'}</tbody></table></div></div>`;
}

async function viewDocument(id, snapshot = false) {
  const context = workspaceContext(), dossierId = context.caseId;
  const record = state.current.documents.find(item => item.id === id);
  const snapshotDocuments = snapshot ? state.run?.request?.documents : null;
  const doc = snapshotDocuments ? snapshotDocuments.find(item => item.id === id) : record?.document;
  if (!doc) throw new Error(snapshotDocuments ? 'Документ отсутствует в сохранённом снимке сверки' : 'Документ не найден');
  const title = doc.filename || id;
  openModal(`${modalHeader(snapshot ? 'Источники сохранённой сверки' : 'Просмотр документа',esc(title))}<div id="viewer-content"><p class="muted">Открываю документ…</p></div><div class="modal-actions"><button data-action="edit-from-viewer" data-id="${esc(id)}">Реквизиты</button><button data-action="close-modal">Закрыть</button></div>`, 'viewer');
  const ticket = state.viewerTicket;
  const activeViewer = () => ticket === state.viewerTicket && isCurrentWorkspace(context)
    && $('#modal').open && $('#viewer-content');
  if (snapshot || state.preview) {
    $('#viewer-content').innerHTML = snapshotContent(doc);
    return;
  }
  try {
    const blob = await api(`/api/cases/${enc(dossierId)}/documents/${enc(id)}/file`, {blob:true});
    if (!activeViewer()) return;
    const lower = title.toLocaleLowerCase();
    if (/\.(txt|csv|tsv|json)$/.test(lower)) {
      const text = await blob.text();
      if (activeViewer()) $('#viewer-content').innerHTML = `<pre class="source file-text">${esc(text)}</pre>`;
    } else if (/\.(pdf|png|jpe?g|gif|webp)$/.test(lower)) {
      state.viewerURL = URL.createObjectURL(blob);
      $('#viewer-content').innerHTML = lower.endsWith('.pdf')
        ? `<iframe title="${esc(title)}" src="${state.viewerURL}"></iframe>`
        : `<img src="${state.viewerURL}" alt="${esc(title)}">`;
    } else $('#viewer-content').innerHTML = snapshotContent(doc) + `<button data-action="source" data-id="${esc(id)}">Скачать исходный файл</button>`;
  } catch (error) {
    if (!activeViewer()) return;
    if (error.status === 404) $('#viewer-content').innerHTML = '<p class="small muted">Оригинальный файл не сохранён в этом комплекте.</p>' + snapshotContent(doc);
    else {
      $('#viewer-content').innerHTML = `<div class="notice">Не удалось открыть исходный файл: ${esc(error.message)}</div><button data-action="view" data-id="${esc(id)}">Повторить</button>`;
    }
  }
}

function selectFiles(files) {
  state.files = Array.from(files);
  $('#file-count').textContent = state.files.length ? `Выбрано: ${state.files.length}` : 'Файлы не выбраны';
  $('#upload-controls').hidden = !state.files.length;
  $('#upload-selection').textContent = state.files.map(file => file.name).join(', ');
}

async function uploadFiles() {
  if (!state.files.length) throw new Error('Выберите файлы');
  const context = workspaceContext(), id = context.caseId;
  const files = state.files.slice(), errors = [], successful = [];
  const documentType = $('#upload-type').value, contractId = $('#upload-contract').value.trim();
  for (const file of files) {
    try {
      if (file.size > 20 * 1024 * 1024) throw new Error('Файл больше 20 МБ');
      if (!/\.(pdf|docx|txt|csv|tsv|json|png|jpe?g|tiff?)$/i.test(file.name)) throw new Error('Неподдерживаемый формат');
      const data = new FormData();
      data.append('file',file);
      if (documentType) data.append('document_type',documentType);
      if (contractId) data.append('contract_id',contractId);
      const response = await api(`/api/cases/${enc(id)}/documents`,{method:'POST',body:data});
      successful.push(response.duplicate ? `${file.name}: повторный файл исключён` : file.name);
    } catch (error) { errors.push({file,message:error.message}); }
  }
  let refreshed = false;
  try {
    if (isCurrentWorkspace(context)) refreshed = await openCase(id,context.options,state.tab,context.selectedRunId);
    else await refreshList();
  } catch (error) {
    toast(`${successful.length ? 'Обработано файлов: ' + successful.length + '. ' : ''}Не удалось обновить комплект: ${error.message}${errors.length ? '. Ошибки загрузки: ' + errors.map(item => item.file.name + ': ' + item.message).join('; ') : ''}`,true);
    return;
  }
  if (errors.length) {
    if (refreshed && state.current?.id === id && state.tab === 'documents') selectFiles(errors.map(item => item.file));
    toast(`${successful.length ? 'Обработано: ' + successful.length + '. ' : ''}${errors.map(item => item.file.name + ': ' + item.message).join('; ')}`,true);
  } else toast('Документы обработаны: ' + successful.join(', '));
}

async function saveCaseMetadata(form) {
  const context = workspaceContext();
  const payload = Object.fromEntries(new FormData(form));
  payload.title = payload.title.trim();
  if (!payload.title) throw new Error('Укажите наименование проверки');
  payload.expected_metadata_revision = state.current.metadata_revision || 0;
  const id = context.caseId;
  const metadata = await api('/api/cases/' + enc(id),{method:'PUT',body:JSON.stringify(payload)});
  if (isCurrentWorkspace(context)) {
    for (const key of ['title','description','contract_number','metadata_revision','updated_at']) state.current[key] = metadata[key];
    render();
  }
  await afterSaved('Реквизиты карточки сохранены.',refreshList);
}

async function saveDocumentType(form) {
  const context = workspaceContext(), modalTicket = state.modalTicket;
  const id = form.dataset.id, selected = $('#type-value').value;
  if (selected === 'corrected') {
    closeModal();
    editDocument(id);
    toast('Укажите заменяемый документ и редакцию. Категория документа сохраняется.');
    return;
  }
  if (!Object.hasOwn(types,selected) && !state.preview) throw new Error('Выберите поддерживаемую категорию документа');
  const record = state.current.documents.find(item => item.id === id);
  if (selected === record.document.type) { closeModal(); return; }
  const values = Object.fromEntries(new FormData(form));
  const updated = structuredClone(record.document);
  updated.type = selected;
  updated.fields_confidence = {...updated.fields_confidence,type:0};
  await api(`/api/cases/${enc(context.caseId)}/documents/${enc(id)}`,{method:'PUT',body:JSON.stringify({document:updated,expected_revision:record.revision,reviewer:values.reviewer?.trim() || (state.preview ? 'Демонстрация' : ''),comment:values.comment?.trim() || (state.preview ? 'Изменён тип в макете' : ''),confirmed_fields:[],confirmed_items:{}})});
  if (state.modalTicket === modalTicket) closeModal();
  await afterSaved('Тип сохранён. Подтвердите его по оригиналу в реквизитах и повторите сверку.',async () => {
    if (isCurrentWorkspace(context)) await openCase(context.caseId,context.options,state.tab,context.selectedRunId);
    else await refreshList();
  });
}

async function saveDocumentStatus(form) {
  const context = workspaceContext(), modalTicket = state.modalTicket;
  const id = form.dataset.id, record = state.current.documents.find(item => item.id === id);
  const values = Object.fromEntries(new FormData(form)), updated = structuredClone(record.document);
  const reviewer = values.reviewer.trim(), comment = values.comment.trim();
  if (!reviewer || !comment) throw new Error('Укажите проверяющего и причину');
  updated.status = form.dataset.status;
  updated.fields_confidence = {...updated.fields_confidence,status:1};
  await api(`/api/cases/${enc(context.caseId)}/documents/${enc(id)}`,{method:'PUT',body:JSON.stringify({document:updated,expected_revision:record.revision,reviewer,comment,confirmed_fields:['status'],confirmed_items:{}})});
  if (state.modalTicket === modalTicket) closeModal();
  await afterSaved('Статус сохранён. Повторите сверку для обновления результата.',async () => {
    if (isCurrentWorkspace(context)) await openCase(context.caseId,context.options,state.tab,context.selectedRunId);
    else await refreshList();
  });
}

async function saveSignalReview(form) {
  const context = workspaceContext(), data = Object.fromEntries(new FormData(form));
  data.reviewer = data.reviewer.trim(); data.comment = data.comment.trim();
  if (!data.reviewer || !data.comment) throw new Error('Укажите проверяющего и комментарий');
  await api(`/api/runs/${enc(context.runId)}/signals/${enc(form.dataset.signal)}/reviews`,{method:'POST',body:JSON.stringify(data)});
  await afterSaved('Решение сохранено в истории.',async () => {
    if (isCurrentWorkspace(context,true)) {
      const savedRun = await api('/api/runs/' + enc(context.runId));
      if (isCurrentWorkspace(context,true)) { state.run = savedRun; render(); }
    }
    await refreshList();
  });
}

document.addEventListener('click', async event => {
  if (event.target.closest('a.skip-link')?.getAttribute?.('href') === '#main') {
    event.preventDefault(); $('#main').focus(); return;
  }
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const action = button.dataset.action;
  button.disabled = true;
  try {
    if (action === 'home') { home(); await refreshList(); }
    if (action === 'new') newCaseModal();
    if (action === 'open') await openCase(button.dataset.id);
    if (action === 'workspace') {
      const id = state.current?.id || state.lastCaseId || state.cases[0]?.id;
      if (id) await openCase(id); else newCaseModal();
    }
    if (action === 'tab') {
      if (!tabs.some(([key]) => key === button.dataset.tab)) return;
      state.tab = button.dataset.tab;
      state.files = [];
      render();
      $('#tab-' + state.tab)?.focus();
      if (state.tab === 'actions') await loadEvents();
    }
    if (action === 'demo') {
      const ticket = state.loadingCase;
      const response = await api('/api/demo/' + enc($('#demo-choice').value),{method:'POST'});
      try {
        if (ticket !== state.loadingCase) { await refreshList(); toast('Демонстрационный комплект создан в реестре'); }
        else if (await openCase(response.case.id,response.options,'overview',null)) {
          if (!state.preview) await run();
        }
      } catch (error) { toast('Демонстрационный комплект создан, но открыть или проверить его не удалось: ' + error.message,true); }
    }
    if (action === 'choose-files') $('#files').click();
    if (action === 'upload') await uploadFiles();
    if (action === 'run') await run();
    if (action === 'edit') editDocument(button.dataset.id);
    if (action === 'close') $('#editor').close();
    if (action === 'close-modal') closeModal();
    if (action === 'type') typeModal(button.dataset.id);
    if (action === 'type-toggle') toggleTypeOptions();
    if (action === 'type-choice') selectType(button);
    if (action === 'exclude') exclusionModal(button.dataset.id);
    if (action === 'view') await viewDocument(button.dataset.id);
    if (action === 'view-snapshot') await viewDocument(button.dataset.id,true);
    if (action === 'edit-from-viewer') { closeModal(); editDocument(button.dataset.id); }
    if (action === 'export') await download(`/api/runs/${enc(state.run.id)}/export?format=${button.dataset.format}`,'proverka.' + button.dataset.format);
    if (action === 'source') await download(`/api/cases/${enc(state.current.id)}/documents/${enc(button.dataset.id)}/file`,state.current.documents.find(item => item.id === button.dataset.id)?.document.filename || 'document');
    if (action === 'history') {
      const context = workspaceContext(), editorTicket = state.editorTicket;
      const rows = await api(`/api/cases/${enc(context.caseId)}/documents/${enc(button.dataset.id)}/history`);
      if (isCurrentWorkspace(context) && editorTicket === state.editorTicket && $('#history')) $('#history').innerHTML = '<h3>История исправлений</h3>' + rows.map(item => `<p class="small">Редакция ${item.revision} · ${esc(item.reviewer)} · ${esc(dateLabel(item.created_at,true))}<br>${esc(item.comment)}</p>`).join('');
    }
    if (action === 'events') await loadEvents();
    if (action === 'global-history') await showHistory();
    if (action === 'history-page') await showHistory(Number(button.dataset.offset));
    if (action === 'open-run') await openCase(button.dataset.case,null,'results',button.dataset.id);
    if (action === 'links') {
      const reviewer = $('#link-reviewer').value.trim(), comment = $('#link-comment').value.trim();
      if (!reviewer || !comment) throw new Error('Укажите проверяющего и основание');
      const links = [...document.querySelectorAll('[data-link-document]')].filter(node => node.value).map(node => ({document_id:node.dataset.linkDocument,line_id:node.dataset.linkLine,target_line_id:node.value,reviewer,comment}));
      state.options.manual_links = [...(state.options.manual_links || []).filter(old => !links.some(link => link.document_id === old.document_id && link.line_id === old.line_id)), ...links];
      await run();
    }
    if (action === 'token') openModal(`${modalHeader('Настройки','Доступ к серверу')}<form data-form="token"><p class="modal-description">Если для сервера задан токен, введите его здесь. Он будет храниться только в этой вкладке.</p><div class="field"><label for="api-token">Токен доступа</label><input id="api-token" name="token" type="password" autocomplete="off" value="${esc(state.token)}"></div><div class="modal-actions"><button class="primary" type="submit">Сохранить</button><button type="button" data-action="close-modal">Отмена</button></div></form>`);
  } catch (error) { toast(error.message,true); }
  finally { button.disabled = false; }
});

document.addEventListener('submit', async event => {
  const form = event.target;
  if (!form.dataset.signal && !form.dataset.form) return;
  event.preventDefault();
  const submit = form.querySelector('[type="submit"]');
  if (submit?.disabled) return;
  if (submit) submit.disabled = true;
  try {
    if (form.dataset.signal) await saveSignalReview(form);
    if (form.dataset.form === 'case-metadata') await saveCaseMetadata(form);
    if (form.dataset.form === 'new-case') {
      const ticket = state.loadingCase, modalTicket = state.modalTicket;
      const payload = Object.fromEntries(new FormData(form));
      payload.title = payload.title.trim();
      if (!payload.title) throw new Error('Укажите наименование проверки');
      const dossier = await api('/api/cases',{method:'POST',body:JSON.stringify(payload)});
      if (state.modalTicket === modalTicket) closeModal();
      await afterSaved('Проверка создана.',async () => {
        if (ticket === state.loadingCase) await openCase(dossier.id,null,'documents',null);
        else await refreshList();
      });
    }
    if (form.dataset.form === 'document-type') await saveDocumentType(form);
    if (form.dataset.form === 'document-status') await saveDocumentStatus(form);
    if (form.dataset.form === 'token') {
      state.token = form.elements.token.value.trim();
      sessionStorage.setItem('kontrol_token',state.token);
      closeModal();
      state.demos = await api('/api/demo');
      await refreshList();
      toast('Настройка доступа сохранена');
    }
  } catch (error) { toast(error.message,true); }
  finally { if (submit) submit.disabled = false; }
});

document.addEventListener('input', event => {
  if (event.target.id === 'registry-query') { state.query = event.target.value; $('#registry-rows').innerHTML = registryRows(); }
});
document.addEventListener('change', event => {
  if (event.target.id === 'registry-status') { state.filter = event.target.value; $('#registry-rows').innerHTML = registryRows(); }
  if (event.target.id === 'files') selectFiles(event.target.files);
  if (event.target.id === 'asof') state.options.as_of = event.target.value;
  if (event.target.id === 'complete') state.options.delivery_complete = event.target.checked;
});
document.addEventListener('dragover', event => {
  const dropzone = event.target.closest('#dropzone');
  if (!dropzone) return;
  event.preventDefault(); dropzone.classList.add('dragging');
});
document.addEventListener('dragleave', event => {
  const dropzone = event.target.closest('#dropzone');
  if (dropzone && !dropzone.contains(event.relatedTarget)) dropzone.classList.remove('dragging');
});
document.addEventListener('drop', event => {
  const dropzone = event.target.closest('#dropzone');
  if (!dropzone) return;
  event.preventDefault(); dropzone.classList.remove('dragging'); selectFiles(event.dataTransfer.files);
});
document.addEventListener('keydown', event => {
  const tab = event.target.closest('[role="tab"]');
  if (tab && ['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) {
    event.preventDefault();
    const index = tabs.findIndex(([key]) => key === tab.dataset.tab);
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    $('#tab-' + tabs[next][0]).click();
  }
  const list = $('#type-options');
  if (list && !list.hidden && ['ArrowDown','ArrowUp','Home','End','Escape'].includes(event.key)) {
    event.preventDefault(); event.stopPropagation();
    if (event.key === 'Escape') { toggleTypeOptions(false); return; }
    const options = [...list.querySelectorAll('[role="option"]')];
    const current = options.indexOf(document.activeElement);
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? options.length - 1 : (current + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length;
    options[next].focus();
  }
});

async function routeFromHash() {
  const hash = (globalThis.location?.hash || '#checks').slice(1);
  const match = hash.match(/^case\/([^/]+)\/(overview|documents|recognition|matching|results|actions)(?:\/run\/([^/]+))?$/);
  if (match) return openCase(decodeURIComponent(match[1]),null,match[2],match[3] ? decodeURIComponent(match[3]) : null);
  if (hash === 'history') return showHistory();
  home();
}

if (globalThis.addEventListener) globalThis.addEventListener('hashchange', () => routeFromHash().catch(error => toast(error.message,true)));
if ($('#modal').addEventListener) $('#modal').addEventListener('close', () => {
  if ($('#modal').open) return;
  ++state.modalTicket;
  ++state.viewerTicket;
  if (state.viewerURL) { URL.revokeObjectURL(state.viewerURL); state.viewerURL = null; }
});
if ($('#editor').addEventListener) $('#editor').addEventListener('close', () => {
  if (!$('#editor').open) ++state.editorTicket;
});

(async () => {
  try {
    const initialHash = globalThis.location?.hash;
    state.demos = await api('/api/demo');
    state.cases = await api('/api/cases');
    if (state.preview) $('#api-link').hidden = true;
    if (initialHash) await routeFromHash(); else home();
  } catch (error) {
    home();
    toast(error.status === 401 ? 'Введите токен сервера через кнопку «Доступ» в боковом меню.' : 'Не удалось загрузить данные: ' + error.message,true);
  }
})();

  </script>
