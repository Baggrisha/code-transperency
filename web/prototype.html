<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#26306E">
  <title>uzniki’s project — прототип</title>
  <link rel="preload" href="assets/fonts/Unbounded-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Montserrat-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/prototype.css">
  <link rel="stylesheet" href="assets/icons.css">
  <link rel="stylesheet" href="assets/brand.css">
</head>
<body>
  <div id="root"></div>
  <noscript>Для работы прототипа включите JavaScript в браузере.</noscript>
  <script>
const KEY = 'control-execution-demo-v1';
const initial = [{
  id: 'DEMO-001',
  number: 'ГК-2026/0142',
  name: 'Поставка уличных скамеек',
  description: 'Учебный кейс T02. Синтетические данные.',
  created: '18.11.2026',
  updated: '18.11.2026',
  status: 'Требует рассмотрения',
  docs: [{
    id: 'd1',
    name: 'Контракт_0142.pdf',
    type: 'Контракт',
    size: 150000,
    version: 1
  }, {
    id: 'd2',
    name: 'Спецификация.pdf',
    type: 'Спецификация',
    size: 82000,
    version: 1
  }, {
    id: 'd3',
    name: 'Накладная_8.pdf',
    type: 'Накладная',
    size: 120000,
    version: 1
  }, {
    id: 'd4',
    name: 'Акт_10.pdf',
    type: 'Документ о приёмке',
    size: 95000,
    version: 1
  }],
  signals: [{
    id: 'SIG-001',
    type: 'Несоответствие количества',
    item: 'Скамейка парковая, позиция 1',
    expected: '10 шт.',
    actual: '8 шт.',
    difference: '2 шт.',
    rule: 'Количество по документу о приёмке (10) − сумма по загруженным накладным (8) = 2',
    explanation: 'В текущем комплекте акт отражает 10 единиц, а накладная — 8. Возможны частичная поставка, дополнительная накладная или исправление документа. Это сигнал для проверки, а не вывод о недопоставке.',
    sources: ['d3', 'd4'],
    status: 'Требует проверки',
    comments: [],
    history: [],
    confidence: 'Высокая для значений; причина не установлена'
  }],
  history: [],
  demo: true
}];
const initialState = () => ({
  cases: JSON.parse(JSON.stringify(initial)),
  selected: null,
  tab: 'overview',
  page: 'home',
  signal: null
});
let state;
try {
  state = JSON.parse(localStorage.getItem(KEY)) || initialState()
} catch {
  state = initialState()
};
if (!state.selected && state.cases?.length) state.selected = state.cases[0].id;
let ephemeralFiles = {};
const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify(state))
  } catch {
    prototypeNotice('Хранилище браузера недоступно. Изменения сохраняются только в открытой вкладке.')
  }
};
const el = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
} [c]));
const c = () => state.cases.find(x => x.id === state.selected);
const go = (page, tab) => {
  state.page = page;
  if (tab) state.tab = tab;
  save();
  render()
};
const pill = s => '<span class="pill ' + (/Подтверждено|Завершена/.test(s) ? 'green' : /Требует|Недостаточно/.test(s) ?
  'orange' : /Не подтверждено/.test(s) ? 'red' : '') + '">' + esc(s) + '</span>';
const log = (item, text) => {
  item.history ??= [];
  item.history.unshift({
    date: new Date().toLocaleString('ru-RU'),
    text
  })
};

function layout(content) {
  const active = state.page === 'case' || state.page === 'signal';
  el.innerHTML = `<div class="app" data-page="${state.page}" data-tab="${state.tab}">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="#" onclick="event.preventDefault();go('home')" aria-label="uzniki’s project, все проверки"><span>uzniki’s</span><span class="brand-accent">project</span></a>
      <nav class="prototype-nav">
        <button class="nav ${state.page==='home'?'active':''}" onclick="go('home')" ${state.page==='home'?'aria-current="page"':''}><span class="identity-icon identity-icon--layers" aria-hidden="true"></span><span>Все проверки</span></button>
        <button class="nav ${active?'active':''}" onclick="${c()?"go('case','overview')":"go('home')"}" ${active?'aria-current="page"':''}><span class="identity-icon identity-icon--home" aria-hidden="true"></span><span>Рабочая область</span></button>
        <button class="nav ${state.page==='history'?'active':''}" onclick="go('history')" ${state.page==='history'?'aria-current="page"':''}><span class="identity-icon identity-icon--alarm" aria-hidden="true"></span><span>История проверок</span></button>
      </nav>
      <div class="sidefoot"><strong>ПРОТОТИП</strong><p>Локальный режим<br>Результаты демонстрационных<br>кейсов не являются реальной<br>сверкой</p></div>
    </aside><main class="main" id="prototype-main">${content}<footer class="footer">Контроль исполнения · Демонстрационный интерфейс · Не принимает юридически значимых решений</footer></main></div>`;
}
const title = (e, t, s, action = '') =>
  `<header class="top"><div class="header-copy"><div class="eyebrow">${e}</div><h1 class="heading">${esc(t)}</h1><p class="sub">${s}</p></div>${action?`<div class="header-action">${action}</div>`:''}</header>`;

function home(history = false) {
  const list = state.cases.filter(x => !history || x.status === 'Завершена');
  layout(title(history ? 'ИСТОРИЯ ПРОВЕРОК' : 'ВСЕ ПРОВЕРКИ', history ? 'История проверок' : 'Проверки контрактов',
      history ? 'Завершённые дела и решения специалистов' : 'Реестр проверочных дел и состояние рассмотрения',
      `<button class="btn primary" onclick="createCase()">+ Новая проверка</button><button class="btn" onclick="openOriginalDemo()">Открыть исходное демо</button>`) +
    `
  <div class="grid registry-metrics">
    <div class="metric"><span>Всего проверок</span><strong>${state.cases.length}</strong></div>
    <div class="metric"><span>В работе</span><strong>${state.cases.filter(x=>x.status!=='Завершена').length}</strong></div>
    <div class="metric"><span>Сигналов</span><strong>${state.cases.reduce((a,x)=>a+x.signals.length,0)}</strong></div>
    <div class="metric"><span>Рассмотрено</span><strong>${state.cases.reduce((a,x)=>a+x.signals.filter(y=>['Подтверждено специалистом','Не подтверждено'].includes(y.status)).length,0)}</strong></div>
  </div><section class="panel registry-panel"><div class="toolbar"><input id="search" aria-label="Поиск по контракту или названию" placeholder="Поиск по контракту или названию" oninput="filterCases()"><select id="statusFilter" aria-label="Статус проверки" onchange="filterCases()"><option value="">Все статусы</option><option>Черновик</option><option>Требует рассмотрения</option><option>Завершена</option></select></div><div class="scroll"><table class="registry-table"><thead><tr><th>Контракт</th><th>Наименование</th><th>Статус</th><th>Документы</th><th>Сигналы</th><th>Изменено</th></tr></thead><tbody id="caseRows">${rows(list)}</tbody></table></div></section>`
    );
}

function rows(list) {
  return list.length ? list.map(x => '<tr class="clickable" onclick="openCase(\'' + x.id + '\')"><td><b>' + esc(x
        .number || x.id) + '</b></td><td>' + esc(x.name || 'Без названия') + (x.demo ?
        '<div class="tag">Демо-кейс</div>' : '') + '</td><td>' + pill(x.status) + '</td><td>' + x.docs.length +
      '</td><td>' + x.signals.length + '</td><td>' + esc(x.updated) + '</td></tr>').join('') :
    '<tr><td colspan="6" class="empty">Проверок пока нет</td></tr>'
}

function filterCases() {
  const q = document.getElementById('search').value.toLowerCase(),
    f = document.getElementById('statusFilter').value;
  document.getElementById('caseRows').innerHTML = rows(state.cases.filter(x => (state.page !== 'history' || x.status ===
    'Завершена') && (x.number + ' ' + x.name).toLowerCase().includes(q) && (!f || x.status === f)));
}

function createCase() {
  let number = prompt('Номер контракта (можно оставить пустым):', '');
  if (number === null) return;
  let name = prompt('Наименование контракта (можно оставить пустым):', '');
  if (name === null) return;
  let id = 'CASE-' + Date.now();
  state.cases.unshift({
    id,
    number,
    name,
    description: '',
    created: new Date().toLocaleDateString('ru-RU'),
    updated: new Date().toLocaleDateString('ru-RU'),
    status: 'Черновик',
    docs: [],
    signals: [],
    history: [],
    demo: false
  });
  state.selected = id;
  state.tab = 'docs';
  state.page = 'case';
  save();
  render()
}

function openCase(id) {
  state.selected = id;
  go('case', 'overview')
}

function openOriginalDemo() {
  const original = JSON.parse(JSON.stringify(initial[0]));
  let demo = state.cases.find(item => item.demo &&
    JSON.stringify({ ...item, id: original.id }) === JSON.stringify(original));
  if (!demo) {
    if (state.cases.some(item => item.id === original.id)) {
      const prefix = 'DEMO-T02-' + Date.now();
      original.id = prefix;
      let suffix = 1;
      while (state.cases.some(item => item.id === original.id)) original.id = prefix + '-' + suffix++;
    }
    state.cases.unshift(original);
    demo = original;
  }
  state.signal = null;
  openCase(demo.id);
  prototypeNotice('Открыто исходное демо. Существующие дела и изменения сохранены.');
}

function casePage() {
  const x = c();
  if (!x) return go('home');
  const tabs = [
    ['overview', 'Обзор'],
    ['docs', 'Документы'],
    ['extract', 'Распознавание'],
    ['match', 'Сопоставление'],
    ['results', 'Результаты'],
    ['history', 'История действий']
  ];
  const sub = `Контракт <b>${esc(x.number||'номер не указан')}</b> — ${esc(x.status.toLowerCase())}${x.demo?' · ДЕМОНСТРАЦИОННЫЕ ДАННЫЕ':''}`;
  const header = title('РАБОЧАЯ ОБЛАСТЬ / ' + esc(x.id), x.name || 'Новая проверка', sub,
      `<button class="btn" onclick="go('home')">← К списку</button>`) +
    `<nav class="steps" aria-label="Разделы проверки">${tabs.map(([k,v])=>`<button class="step ${state.tab===k?'active':''}" ${state.tab===k?'aria-current="page"':''} onclick="go('case','${k}')">${v}</button>`).join('')}</nav>`;
  const body = state.tab === 'overview' ? overview(x) : state.tab === 'docs' ? docs(x) : state.tab === 'extract' ?
    extract(x) : state.tab === 'match' ? match(x) : state.tab === 'results' ? results(x) : hist(x);
  layout(header + body);
}

function overview(x) {
  return `<div class="grid overview-metrics">
  <div class="metric"><span>Документов</span><strong>${x.docs.length}</strong></div>
  <div class="metric"><span>Сигналов</span><strong>${x.signals.length}</strong></div>
  <div class="metric"><span>Ожидают решения</span><strong>${x.signals.filter(s=>s.status==='Требует проверки').length}</strong></div>
  <div class="metric"><span>Рассмотрено</span><strong>${x.signals.filter(s=>['Подтверждено специалистом','Не подтверждено'].includes(s.status)).length}</strong></div></div>
  <section class="panel contract-panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--wallet section-icon" aria-hidden="true"></span><span>Данные контракта</span></h2>
  <div class="field"><label for="caseNumber">Номер</label><input id="caseNumber" value="${esc(x.number)}"></div>
  <div class="field"><label for="caseName">Наименование</label><input id="caseName" value="${esc(x.name)}"></div>
  <div class="field"><label for="caseDescription">Описание</label><textarea id="caseDescription" rows="3">${esc(x.description)}</textarea></div>
  <div class="actions"><button class="btn primary" onclick="updateCase()">Сохранить реквизиты</button><button class="btn" onclick="go('case','docs')">К документам →</button></div></section>
  <div class="warn">Система предоставляет информационные сигналы. Окончательная оценка документов остаётся за специалистом</div>`;
}

function updateCase() {
  let x = c();
  x.number = document.getElementById('caseNumber').value;
  x.name = document.getElementById('caseName').value;
  x.description = document.getElementById('caseDescription').value;
  log(x, 'Изменены реквизиты проверки');
  save();
  render()
}
const types = ['Контракт', 'Накладная', 'Спецификация', 'Документ о приёмке', 'Дополнительное соглашение',
  'Исправленная версия', 'Другое'
];

function docs(x) {
  return `<div class="cols docs-cols"><section class="panel upload-card"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--folder section-icon" aria-hidden="true"></span><span>Загрузка документов</span></h2>
  <div id="drop" class="drop" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="dropFiles(event)">
  <span class="identity-icon identity-icon--folder upload-icon" aria-hidden="true"></span><h3>Перетащите файлы сюда</h3><p class="upload-hint">или выберите файлы на устройстве (<b>PDF, PNG, JPEG, TXT</b>)</p>
  <div class="file-picker-row"><button type="button" class="btn" onclick="document.getElementById('files').click()">Выбрать файлы</button><span>Файлы не выбраны</span></div>
  <input class="visually-hidden" type="file" id="files" multiple accept=".pdf,.png,.jpg,.jpeg,.txt" aria-label="Выбрать файлы" onchange="addFiles(this.files)"></div>
  <p class="note storage-note">Файлы сохраняются только в памяти открытой вкладки. Метаданные и решения — в локальном хранилище браузера. Для постоянного хранения файлов требуется сервер</p></section>
  <section class="panel document-card"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--folder section-icon" aria-hidden="true"></span><span>Комплект документов: <span class="accent">${x.docs.length}</span></span></h2>${x.docs.length?x.docs.map(d=>`<div class="doc"><div class="document-info"><div class="docname"><b>${esc(d.name)}</b></div><div class="sub">${esc(d.type)} – ${Math.round(d.size/1024)} КБ – версия ${d.version}</div></div><div class="actions"><button class="btn small" onclick="changeDocType('${d.id}')">Тип</button><button class="btn small" onclick="viewDoc('${d.id}')">Открыть</button><button class="btn small" aria-label="Удалить ${esc(d.name)} из комплекта" onclick="removeDoc('${d.id}')">×</button></div></div>`).join(''):'<div class="empty">Документы ещё не добавлены</div>'}</section></div>
  <div class="warn documents-warning">Если в загруженном комплекте отсутствует документ, это не означает, что он отсутствует у сторон контракта</div><div class="actions"><button class="btn primary" onclick="go('case','extract')">К распознаванию →</button></div>`;
}

function dropFiles(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag');
  addFiles(e.dataTransfer.files)
}

function addFiles(files) {
  let x = c();
  for (let f of files) {
    if (!/\.(pdf|png|jpe?g|txt)$/i.test(f.name)) {
      alert('Неподдерживаемый формат: ' + f.name);
      continue
    }
    if (x.docs.some(d => d.name === f.name && d.size === f.size)) {
      alert('Возможный дубликат: ' + f.name);
      continue
    }
    let id = 'DOC-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    let type = /контракт/i.test(f.name) ? 'Контракт' : /спец/i.test(f.name) ? 'Спецификация' : /наклад/i.test(f.name) ?
      'Накладная' : /акт|прием|приём/i.test(f.name) ? 'Документ о приёмке' : 'Другое';
    x.docs.push({
      id,
      name: f.name,
      size: f.size,
      type,
      version: 1
    });
    ephemeralFiles[id] = f;
    log(x, 'Добавлен документ ' + f.name)
  }
  x.updated = new Date().toLocaleDateString('ru-RU');
  save();
  render()
}

function removeDoc(id) {
  if (!confirm('Удалить документ из комплекта?')) return;
  let x = c(),
    d = x.docs.find(d => d.id === id);
  x.docs = x.docs.filter(d => d.id !== id);
  delete ephemeralFiles[id];
  log(x, 'Удалён документ ' + d.name);
  save();
  render()
}

function extract(x) {
  return `<section class="panel recognition-panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--chip section-icon" aria-hidden="true"></span><span>Распознавание реквизитов</span></h2><div class="warn">Модуль OCR и извлечения данных ещё не подключён. Ниже доступны редактируемые реквизиты проверки, но значения из загруженных файлов автоматически не извлекаются.</div>
  <div class="cols recognition-cols"><section class="recognition-sources"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--folder section-icon" aria-hidden="true"></span><span>Исходные документы</span></h2>${x.docs.map(d=>`<div class="doc"><span class="docname">${esc(d.name)}</span><button class="btn small" onclick="viewDoc('${d.id}')">Просмотреть</button></div>`).join('')||'<p class="muted">Документы ещё не добавлены</p>'}</section><section class="recognition-fields">
  <div class="field"><label for="caseNumber">Номер</label><input id="caseNumber" value="${esc(x.number)}"></div>
  <div class="field"><label for="caseName">Наименование</label><input id="caseName" value="${esc(x.name)}"></div>
  <div class="field"><label for="caseDescription">Описание</label><textarea id="caseDescription" rows="3">${esc(x.description)}</textarea></div>
  <div class="actions"><button class="btn primary" onclick="updateCase()">Сохранить исправления</button><button class="btn" onclick="go('case','match')">К сопоставлению →</button></div></section></div></section>`;
}

function match(x) {
  return '<div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--layers section-icon" aria-hidden="true"></span><span>Сопоставление позиций</span></h2><div class="warn">Автоматическое связывание товарных позиций ожидает подключения серверного модуля. Система не выполняет сравнение единиц измерения без подтверждённого коэффициента пересчёта.</div>' +
    (x.demo ?
      '<div class="scroll"><table class="matching-table"><thead><tr><th>Позиция</th><th>Контракт</th><th>Накладная</th><th>Приёмка</th><th>Состояние</th></tr></thead><tbody><tr><td>Скамейка парковая</td><td>10 шт.</td><td>8 шт.</td><td>10 шт.</td><td>' +
      pill('Требует проверки') +
      '</td></tr></tbody></table></div><p class="note">Демонстрационное сопоставление из синтетического кейса T02.</p>' :
      '<div class="empty">Позиции появятся после подключения извлечения и сопоставления данных.</div>') +
    '</div><div class="actions"><button class="btn primary" onclick="go(\'case\',\'results\')">К результатам →</button></div>'
}

function results(x) {
  return '<div class="grid"><div class="metric"><span>Обработанные документы</span><strong>' + x.docs.length +
    '</strong></div><div class="metric"><span>Сопоставленные позиции</span><strong>' + (x.demo ? '1' : '—') +
    '</strong></div><div class="metric"><span>Сигналы</span><strong>' + x.signals.length +
    '</strong></div><div class="metric"><span>Рассмотренные сигналы</span><strong>' + x.signals.filter(s => [
      'Подтверждено специалистом', 'Не подтверждено'
    ].includes(s.status)).length + '</strong></div></div>' + (x.demo ?
      '<div class="warn">Результаты ниже подготовлены для учебного кейса T02 и не получены автоматической обработкой загруженных документов.</div>' :
      '<div class="warn">Реальная автоматическая сверка ещё не подключена. Отсутствие сигналов здесь не означает, что расхождений нет.</div>'
      ) +
    '<div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--bell section-icon" aria-hidden="true"></span><span>Реестр расхождений</span></h2><div class="toolbar"><input id="signalSearch" placeholder="Поиск по позиции или типу" oninput="filterSignals()"><select id="signalFilter" onchange="filterSignals()"><option value="">Все статусы</option>' +
    ['Требует проверки', 'В работе', 'Подтверждено специалистом', 'Не подтверждено', 'Недостаточно данных'].map(s =>
      '<option>' + s + '</option>').join('') +
    '</select></div><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Тип</th><th>Позиция</th><th>Статус</th><th>Действие</th></tr></thead><tbody id="signalRows">' +
    signalRows(x.signals) +
    '</tbody></table></div></div><div class="actions"><button class="btn" onclick="exportQuestions()">Экспорт перечня вопросов</button><button class="btn" onclick="finishCase()">Завершить рассмотрение</button></div>'
}

function signalRows(a) {
  return a.length ? a.map(s => '<tr><td>' + esc(s.id) + '</td><td>' + esc(s.type) + '</td><td>' + esc(s.item) +
      '</td><td>' + pill(s.status) + '</td><td><button class="btn small" onclick="openSignal(\'' + s.id +
      '\')">Рассмотреть →</button></td></tr>').join('') :
    '<tr><td colspan="5" class="empty">Нет сигналов для отображения</td></tr>'
}

function filterSignals() {
  let q = document.getElementById('signalSearch').value.toLowerCase(),
    f = document.getElementById('signalFilter').value;
  document.getElementById('signalRows').innerHTML = signalRows(c().signals.filter(s => (s.type + ' ' + s.item)
    .toLowerCase().includes(q) && (!f || s.status === f)))
}

function openSignal(id) {
  state.signal = id;
  go('signal')
}

function signalPage() {
  let x = c(),
    s = x?.signals.find(s => s.id === state.signal);
  if (!s) return go('case', 'results');
  layout(title('Результаты / ' + esc(s.id), s.type, esc(s.item),
      '<button class="btn" onclick="go(\'case\',\'results\')">← К результатам</button>') +
    '<div class="cols"><div><div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--bell section-icon" aria-hidden="true"></span><span>Основание сигнала</span></h2><div class="detail"><div class="value"><span class="sub">Ожидаемое значение</span><b>' +
    esc(s.expected) + '</b></div><div class="value"><span class="sub">Значение в комплекте</span><b>' + esc(s
    .actual) + '</b></div></div><div class="field"><label>Расчётное отклонение</label><strong>' + esc(s.difference) +
    '</strong></div><div class="field"><label>Правило сопоставления</label><div class="note">' + esc(s.rule) +
    '</div></div><div class="field"><label>Пояснение</label><p class="sub">' + esc(s.explanation) +
    '</p></div><div class="field"><label>Определённость</label><p class="note">' + esc(s.confidence) +
    '</p></div></div><div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--folder section-icon" aria-hidden="true"></span><span>Документы-источники</span></h2>' + s.sources.map(id => {
      let d = x.docs.find(d => d.id === id);
      return d ? '<div class="doc"><span>' + esc(d.name) + '</span><button class="btn small" onclick="viewDoc(\'' +
        d.id + '\')">Открыть</button></div>' : ''
    }).join('') +
    '<p class="note">Точная подсветка фрагментов появится после передачи координат/страниц серверным модулем.</p></div></div><div><div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--users section-icon" aria-hidden="true"></span><span>Рассмотрение специалистом</span></h2><div class="field"><label>Статус</label><select id="signalStatus">' +
    ['Требует проверки', 'В работе', 'Подтверждено специалистом', 'Не подтверждено', 'Недостаточно данных'].map(t =>
      '<option ' + (s.status === t ? 'selected' : '') + '>' + t + '</option>').join('') +
    '</select></div><div class="field"><label>Комментарий специалиста</label><textarea id="comment" rows="5" placeholder="Укажите основания решения или недостающие документы"></textarea></div><button class="btn primary" onclick="saveSignal()">Сохранить решение</button><p class="note">Подтверждение означает подтверждение документального расхождения, а не установление правонарушения.</p></div><div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--alarm section-icon" aria-hidden="true"></span><span>История рассмотрения</span></h2>' +
    (s.history.length ? s.history.map(h => '<div class="history"><b>' + esc(h.text) + '</b><div class="sub">' + esc(h
      .date) + '</div></div>').join('') : '<div class="empty">Изменений пока нет</div>') + '</div></div></div>')
}

function saveSignal() {
  let x = c(),
    s = x.signals.find(s => s.id === state.signal),
    status = document.getElementById('signalStatus').value,
    comment = document.getElementById('comment').value.trim();
  if (status !== s.status) {
    log(s, 'Статус: ' + s.status + ' → ' + status);
    log(x, 'Сигнал ' + s.id + ': ' + status);
    s.status = status
  }
  if (comment) {
    s.comments.push({
      date: new Date().toLocaleString('ru-RU'),
      text: comment
    });
    log(s, 'Комментарий: ' + comment);
    log(x, 'Добавлен комментарий к ' + s.id)
  }
  x.updated = new Date().toLocaleDateString('ru-RU');
  save();
  render()
}

function hist(x) {
  return '<div class="panel"><h2 class="section-heading sectionTitle"><span class="identity-icon identity-icon--alarm section-icon" aria-hidden="true"></span><span>Журнал действий</span></h2>' + (x.history.length ? x.history.map(h =>
      '<div class="history"><b>' + esc(h.text) + '</b><div class="sub">' + esc(h.date) + '</div></div>').join('') :
    '<div class="empty">Действий пока нет</div>') + '</div>'
}

function finishCase() {
  let x = c();
  if (x.signals.some(s => s.status === 'Требует проверки' || s.status === 'В работе') && !confirm(
      'Остались сигналы без итогового решения. Завершить рассмотрение?')) return;
  x.status = 'Завершена';
  log(x, 'Рассмотрение завершено');
  save();
  render()
}

function exportQuestions() {
  let x = c(),
    lines = ['Проверка: ' + (x.number || x.id), 'Демонстрационные данные: ' + (x.demo ? 'да' : 'нет'), ''];
  x.signals.forEach(s => lines.push(s.id + ' — ' + s.type + ' — ' + s.item + ' — ' + s.status + '\n' + s.explanation +
    '\n'));
  let a = document.createElement('a'),
    u = URL.createObjectURL(new Blob([lines.join('\n')], {
      type: 'text/plain;charset=utf-8'
    }));
  a.href = u;
  a.download = 'questions-' + x.id + '.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000)
}
let prototypePreviousFocus = null;

function closeDocModal() {
  const node = document.getElementById('docModal');
  if (!node) return;
  node.remove();
  if (prototypePreviousFocus?.isConnected) prototypePreviousFocus.focus();
}

function changeDocType(id) {
  const x = c(),
    d = x.docs.find(z => z.id === id);
  if (!d) return;
  closeDocModal();
  prototypePreviousFocus = document.activeElement;
  const overlay = document.createElement('div');
  overlay.id = 'docModal';
  overlay.className = 'modalOverlay type-overlay';
  overlay.innerHTML =
    `<section class="modalWindow type-window" role="dialog" aria-modal="true" aria-labelledby="prototype-modal-title" tabindex="-1">
  <div class="modalHead"><div><div class="eyebrow">Классификация документа</div><h2 id="prototype-modal-title" class="section-heading"><span class="identity-icon identity-icon--tag section-icon" aria-hidden="true"></span><span>Изменить тип документа</span></h2></div><button class="btn" onclick="closeDocModal()">Закрыть ×</button></div>
  <p class="modal-filename">${esc(d.name)}</p><div class="field"><label class="type-label" for="prototype-type-trigger">Категория документа</label><input type="hidden" id="docCategory" value="${esc(d.type)}">
  <div class="type-picker"><button class="type-trigger" id="prototype-type-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="prototype-type-options" onclick="togglePrototypeType()"><span id="prototype-type-selected">${esc(d.type)}</span><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  <div class="type-list" id="prototype-type-options" role="listbox" aria-label="Категория документа" hidden>${types.map((t,i)=>`<button class="type-option" type="button" role="option" aria-selected="${t===d.type}" onclick="choosePrototypeType(${i})">${esc(t)}</button>`).join('')}</div></div></div>
  <p class="note">Тип определяет роль документа в сверке: контракт задаёт условия, накладные подтверждают поставку, акт фиксирует приёмку, дополнительное соглашение меняет действующую редакцию.</p>
  <div class="actions"><button class="btn primary" onclick="saveDocCategory('${id}')">Сохранить тип</button><button class="btn" onclick="closeDocModal()">Отмена</button></div></section>`;
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeDocModal()
  });
  document.body.appendChild(overlay);
  overlay.querySelector('.modalWindow').focus();
}

function togglePrototypeType(force) {
  const list = document.getElementById('prototype-type-options'),
    trigger = document.getElementById('prototype-type-trigger');
  if (!list) return;
  const expanded = typeof force === 'boolean' ? force : list.hidden;
  list.hidden = !expanded;
  trigger.setAttribute('aria-expanded', String(expanded));
  if (expanded)(list.querySelector('[aria-selected="true"]') || list.querySelector('button'))?.focus();
  else trigger.focus();
}

function choosePrototypeType(index) {
  const value = types[index];
  if (!value) return;
  document.getElementById('docCategory').value = value;
  document.getElementById('prototype-type-selected').textContent = value;
  document.querySelectorAll('#prototype-type-options [role="option"]').forEach((node, i) => node.setAttribute(
    'aria-selected', String(i === index)));
  togglePrototypeType(false);
}

function saveDocCategory(id) {
  let x = c(),
    d = x.docs.find(z => z.id === id);
  if (!d) return;
  let t = document.getElementById('docCategory').value;
  if (t !== d.type) {
    log(x, 'Тип документа ' + d.name + ': ' + d.type + ' → ' + t);
    d.type = t;
    save()
  }
  closeDocModal();
  render()
}
const demoContents = {
  d1: {
    title: 'Государственный контракт № ГК-2026/0142',
    lines: ['Предмет: поставка уличных скамеек', 'Позиция 1: Скамейка парковая', 'Количество по контракту: 10 шт.',
      'Данные синтетические. Документ показан для демонстрации.'
    ]
  },
  d2: {
    title: 'Спецификация к контракту',
    lines: ['Позиция 1: Скамейка парковая', 'Единица измерения: шт.', 'Количество: 10',
      'Редакция: 1 (демонстрационная)'
    ]
  },
  d3: {
    title: 'Товарная накладная',
    lines: ['Контракт: ГК-2026/0142', 'Позиция 1: Скамейка парковая', 'Передано по накладной: 8 шт.',
      'Другая накладная в комплекте не представлена.'
    ]
  },
  d4: {
    title: 'Документ о приёмке',
    lines: ['Контракт: ГК-2026/0142', 'Позиция 1: Скамейка парковая', 'Количество по акту: 10 шт.',
      'Для объяснения разницы нужны дополнительные сведения.'
    ]
  }
};

function viewDoc(id) {
  let x = c(),
    d = x.docs.find(z => z.id === id);
  if (!d) return;
  let f = ephemeralFiles[id];
  if (f) {
    window.open(URL.createObjectURL(f), '_blank');
    return
  }
  closeDocModal();
  prototypePreviousFocus = document.activeElement;
  let demo = x.demo ? demoContents[id] : null;
  const overlay = document.createElement('div');
  overlay.id = 'docModal';
  overlay.className = 'modalOverlay';
  overlay.innerHTML =
    '<div class="modalWindow viewer-window" role="dialog" aria-modal="true" aria-label="Просмотр документа" tabindex="-1"><div class="modalHead"><div><div class="eyebrow">Просмотр документа</div><h2>' +
    esc(d.name) + '</h2></div><button class="btn" onclick="closeDocModal()">Закрыть ×</button></div><div class="sub">' +
    esc(d.type) + ' · версия ' + esc(d.version) + '</div>' + (demo ?
      '<div class="warn">Синтетический предпросмотр по тестовому кейсу T02. Это не оригинальный PDF и не результат OCR.</div><div class="paperPreview"><h3>' +
      esc(demo.title) + '</h3>' + demo.lines.map(line => '<p>' + esc(line) + '</p>').join('') + '</div>' :
      '<div class="warn">Оригинальный файл недоступен: в прототипе сохранены только метаданные. Загрузите документ заново для просмотра или подключите серверное хранилище.</div>'
      ) + '<div class="actions"><button class="btn" onclick="changeDocType(&quot;' + id +
    '&quot;)">Изменить тип</button><button class="btn primary" onclick="closeDocModal()">Готово</button></div></div>';
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeDocModal()
  });
  document.body.appendChild(overlay);
  overlay.querySelector('.modalWindow').focus()
}

function prototypeNotice(message) {
  let toast = document.getElementById('prototype-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'prototype-toast';
    toast.setAttribute('role', 'status');
    document.body.appendChild(toast)
  }
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(prototypeNotice.timer);
  prototypeNotice.timer = setTimeout(() => toast.hidden = true, 6500);
}
document.addEventListener('keydown', event => {
  const modal = document.getElementById('docModal');
  if (!modal) return;
  const list = document.getElementById('prototype-type-options');
  if (list && !list.hidden && ['ArrowDown', 'ArrowUp', 'Home', 'End', 'Escape'].includes(event.key)) {
    event.preventDefault();
    if (event.key === 'Escape') {
      togglePrototypeType(false);
      return
    }
    const options = [...list.querySelectorAll('[role="option"]')],
      index = options.indexOf(document.activeElement);
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? options.length - 1 : (index + (event.key ===
      'ArrowDown' ? 1 : -1) + options.length) % options.length;
    options[next].focus();
    return;
  }
  if (event.key === 'Escape') {
    event.preventDefault();
    closeDocModal();
    return
  }
  if (event.key === 'Tab') {
    const focusable = [...modal.querySelectorAll(
      'button,input:not([type="hidden"]),select,textarea,a[href],[tabindex="0"]')].filter(node => !node
      .disabled && !node.closest('[hidden]'));
    const first = focusable[0],
      last = focusable[focusable.length - 1];
    if (event.shiftKey && (document.activeElement === first || document.activeElement === modal.querySelector(
        '.modalWindow'))) {
      event.preventDefault();
      last?.focus()
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first?.focus()
    }
  }
});

function render() {
  if (state.page === 'case') casePage();
  else if (state.page === 'signal') signalPage();
  else home(state.page === 'history')
}
render();
  </script>
